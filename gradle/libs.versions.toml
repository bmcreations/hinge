# Kotlin must be at least the compiler Compose Multiplatform's klibs were built with, or
# Kotlin/Native cannot read them. CMP 1.12.0 ships klib ABI 2.3.0 from Kotlin 2.3.20 (see the
# `compiler_version` in any of its iOS klib manifests); 2.2.20 fails with "KLIB resolver: Could
# not find" on a file that is present. Re-check that manifest when bumping CMP.
[versions]
kotlin = "2.3.20"
agp = "9.4.1"
composeMultiplatform = "1.12.0"
coroutines = "1.10.2"
androidxWindow = "1.4.0"
androidxCore = "1.16.0"
androidxActivity = "1.10.1"
androidxLifecycle = "2.9.1"
androidMinSdk = "24"
androidCompileSdk = "37"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

androidx-window = { module = "androidx.window:window", version.ref = "androidxWindow" }
androidx-window-core = { module = "androidx.window:window-core", version.ref = "androidxWindow" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }

compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
